# Build the hashterm .deb and publish SLSA provenance for it.
#
# Runs on every published release (and by hand via workflow_dispatch). The
# build happens in a debian:sid container because hashterm needs GTK >= 4.18
# and VTE >= 0.84, newer than any ubuntu-latest runner image ships.
#
# Reproducibility follow-up (tracked): pin `container` by @sha256 digest and
# the `actions/*` steps by commit SHA so the provenance covers fixed inputs;
# the toolchain is already pinned via rust-toolchain.toml. The
# slsa-github-generator reusable workflow MUST stay pinned by tag (its own
# verification depends on it). Verify downloads with:
#   slsa-verifier verify-artifact hashterm_*.deb \
#     --provenance-path *.intoto.jsonl \
#     --source-uri github.com/redasgard/hashterm

name: release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:sid
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git \
            libgtk-4-dev libvte-2.91-gtk4-dev libgtk4-layer-shell-dev \
            fakeroot dpkg-dev gzip

      - name: Install Rust
        # rust-toolchain.toml pins the exact channel; installer bootstraps it.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -o rustup-init.sh https://sh.rustup.rs
          sh rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Supply-chain audit
        # No `|| true`: a failed install or a real finding (advisory, banned
        # crate/source, disallowed license) must FAIL the release, not print an
        # easy-to-miss warning while the build+publish proceeds unaudited.
        run: |
          cargo install --locked cargo-deny
          cargo deny check advisories bans sources licenses

      - name: Build .deb
        run: |
          cargo build --release --locked
          ./packaging/build-deb.sh

      - name: Generate provenance subjects
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "hashes=$(sha256sum hashterm_*.deb | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hashterm-deb
          path: dist/hashterm_*.deb

  # Separate job so contents:write (release upload) is scoped to just this
  # step, not held for the whole build (where a build.rs could abuse it).
  upload:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hashterm-deb
      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" hashterm_*.deb --clobber

  provenance:
    needs: [build]
    permissions:
      actions: read   # read the workflow path
      id-token: write # sign the provenance
      contents: write # attach provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: ${{ github.event_name == 'release' }}

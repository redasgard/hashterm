# Build the hashterm .deb, generate SLSA provenance for it, and stage both in a
# DRAFT GitHub release. A human publishes the draft.
#
# Why a draft: this repository uses GitHub's immutable releases. Once a release
# is published its assets can never be added, replaced or deleted, so everything
# that belongs to it (the .deb AND its provenance) must be attached BEFORE
# publishing. Attaching after publish fails with "Cannot delete asset from an
# immutable release". A published release also burns its tag name for good.
#
# To release: bump `version` in Cargo.toml, commit, push, then
#   git tag -a vX.Y.Z -m "hashterm X.Y.Z" && git push origin vX.Y.Z
# CI builds and creates the draft release vX.Y.Z (a tag containing "-", such as
# v0.3.0-rc1, becomes a pre-release). Edit the notes if you like, then Publish.
# Run by hand (workflow_dispatch) it only builds and keeps the artifacts.
# See docs/RELEASING.md.
#
# The build happens in a debian:trixie (Debian 13) container: hashterm needs
# GTK >= 4.18 and VTE >= 0.80, newer than any ubuntu-latest runner image ships,
# and building on stable keeps the .deb's glibc floor installable on Debian 13.
#
# Reproducibility follow-up (tracked): pin `container` by @sha256 digest and
# the `actions/*` steps by commit SHA so the provenance covers fixed inputs;
# the toolchain is already pinned via rust-toolchain.toml. The
# slsa-github-generator reusable workflow MUST stay pinned by tag (its own
# verification depends on it). Verify downloads with:
#   slsa-verifier verify-artifact hashterm_X.Y.Z-1_amd64.deb \
#     --provenance-path hashterm_X.Y.Z-1_amd64.deb.intoto.jsonl \
#     --source-uri github.com/redasgard/hashterm --source-tag vX.Y.Z

name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the package version
        # A v0.2.3 tag on a tree that still says 0.2.2 would publish a release
        # whose .deb has the wrong version. Fail before the long build.
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${REF_NAME#v}"; tag="${tag%%-*}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $ver"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config git \
            libgtk-4-dev libvte-2.91-gtk4-dev libgtk4-layer-shell-dev \
            fakeroot dpkg-dev gzip

      - name: Install Rust
        # rust-toolchain.toml pins the exact channel; installer bootstraps it.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -o rustup-init.sh https://sh.rustup.rs
          sh rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Supply-chain audit
        # No `|| true`: a failed install or a real finding (advisory, banned
        # crate/source, disallowed license) must FAIL the release, not print an
        # easy-to-miss warning while the build+publish proceeds unaudited.
        run: |
          cargo install --locked cargo-deny
          cargo deny check advisories bans sources licenses

      - name: Build .deb
        run: |
          cargo build --release --locked
          ./packaging/build-deb.sh

      - name: Generate provenance subjects
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "hashes=$(sha256sum hashterm_*.deb | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hashterm-deb
          path: dist/hashterm_*.deb

  # Signed provenance for the .deb. It is NOT uploaded to a release here
  # (upload-assets: false): the generator would add it to an already-published,
  # immutable release and fail. It stays a workflow artifact and the
  # draft-release job below attaches it before anything is published.
  provenance:
    needs: [build]
    permissions:
      actions: read   # read the workflow path
      id-token: write # sign the provenance
      contents: write # required by the reusable workflow's own upload job
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false

  # Separate job so contents:write is scoped to just this step, not held for the
  # whole build (where a build.rs could abuse it). It only ever creates or
  # refreshes a DRAFT: if the release was already published (immutable) the
  # upload fails, by design.
  draft-release:
    needs: [build, provenance]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hashterm-deb
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: assets
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l assets
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the draft's assets.
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* --draft --verify-tag --generate-notes \
              "${pre[@]}" --title "hashterm ${TAG#v}" --repo "$GITHUB_REPOSITORY"
          fi

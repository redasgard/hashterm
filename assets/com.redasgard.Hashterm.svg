<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- hashterm app icon: quake-console panel sliding from the top, # prompt -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f33"/>
      <stop offset="1" stop-color="#16181a"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="58" rx="22" fill="#0e1012" opacity="0.55"/>
  <rect x="14" y="58" width="100" height="3" rx="1.5" fill="#61afef" opacity="0.85"/>
  <text x="26" y="104" font-family="monospace" font-size="52" font-weight="bold"
        fill="#98c379">#</text>
  <rect x="62" y="92" width="30" height="10" rx="2" fill="#c5c8c6">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>

# hashterm bundled tmux configuration — loaded with `tmux -L hashterm -f <this>`,
# so the user's ~/.tmux.conf is never read and the default server is untouched.

set -s escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g window-size latest
set -g destroy-unattached off
set -s exit-unattached off
# Keep the server alive with zero sessions (the GUI may briefly have no tabs,
# and ensure_server relies on a bare start-server persisting).
set -s exit-empty off

# The GUI owns tab/window chrome.
set -g status off
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# GUI event hooks (hashterm-ctl no-ops when the GUI isn't running).
set-hook -g session-created  'run-shell "hashterm-ctl event session-created #{q:hook_session_name}"'
set-hook -g session-closed   'run-shell "hashterm-ctl event session-closed #{q:hook_session_name}"'
set-hook -g session-renamed  'run-shell "hashterm-ctl event session-renamed #{q:hook_session_name}"'
set-hook -g client-attached  'run-shell "hashterm-ctl event client-attached #{q:hook_session_name}"'
set-hook -g client-detached  'run-shell "hashterm-ctl event client-detached #{q:hook_session_name}"'
set-hook -g alert-bell       'run-shell "hashterm-ctl event bell #{q:hook_session_name}"'
set-hook -g alert-activity   'run-shell "hashterm-ctl event activity #{q:hook_session_name}"'

# Tab-model keybindings: tmux window keys drive GUI tabs instead
# (removed when tmux.native_windows = true — the app appends an override block).
bind-key c run-shell "hashterm-ctl event new-tab"
bind-key n run-shell "hashterm-ctl event next-tab"
bind-key p run-shell "hashterm-ctl event prev-tab"

# cargo-deny configuration. Run: cargo deny check
# Enforced in CI (see .github/workflows/slsa-release.yml).

[advisories]
# Fail on any security advisory or unmaintained crate.
yanked = "deny"

[bans]
# Surface duplicate crate versions. Our direct picks are unified (x11rb is
# pinned to 0.13 to match global-hotkey); the remaining duplicates (syn, toml,
# windows-sys, …) are unavoidable transitive splits in the gtk-rs stack, so
# this stays a warning rather than "deny".
multiple-versions = "warn"
# Deny wildcard version requirements — EXCEPT for the internal workspace crates,
# which reference each other by `path` with `version = "*"` (idiomatic and safe:
# they resolve to the in-tree copy, never crates.io). This keeps the check
# meaningful for real (registry) wildcard deps.
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# Permissive licenses only; hashterm itself is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
